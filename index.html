<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0c">
  <meta name="description" content="1936 Manhattan’ında bir dartın peşinden ilerleyen 29 saniyelik sinematik kısa film.">
  <meta property="og:title" content="New York in Flight">
  <meta property="og:description" content="Bir dartın peşinde 1936 Manhattan’ı.">
  <meta property="og:image" content="https://fatihyaylacimk.github.io/new-york-in-flight/assets/film/first-frame.webp?v=3">
  <title>New York in Flight</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="preload" href="assets/film/first-frame.webp?v=3" as="image" fetchpriority="high">
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="film.js?v=2" defer></script>
</head>
<body>
  <main class="cinema" id="cinema" aria-label="New York in Flight">
    <video id="picture" class="picture" playsinline muted controls tabindex="0" preload="metadata"
      poster="assets/film/first-frame.webp?v=3" width="1920" height="1080"
      aria-label="1936 Manhattan’ında dartın yolculuğu">
      <source src="assets/film/new-york-in-flight.mp4?v=3" type="video/mp4">
      Tarayıcın filmi gömülü oynatamıyor.
      <a href="assets/film/new-york-in-flight.mp4?v=3">Filmi MP4 olarak aç.</a>
    </video>

    <div class="interface" id="interface" hidden>
      <div class="shade" aria-hidden="true"></div>
      <header class="masthead">
        <h1 lang="en">New York <em>in Flight</em></h1>
        <p>Manhattan, 1936</p>
      </header>

      <button class="center-play" id="center-play" type="button" aria-label="Filmi oynat" title="Filmi oynat">
        <span class="symbol symbol-play" aria-hidden="true"></span>
      </button>

      <p class="status" id="status" role="status" hidden></p>

      <div class="controls" role="group" aria-label="Film kontrolleri">
        <label class="visually-hidden" for="seek">Film süresi</label>
        <input id="seek" class="seek" type="range" min="0" max="29" step="0.01" value="0"
          aria-valuetext="0:00, Atış">
        <div class="controls-row">
          <button class="tool" id="play" type="button" aria-label="Filmi oynat" title="Filmi oynat">
            <span class="symbol symbol-play" aria-hidden="true"></span>
          </button>
          <div class="time">
            <span id="elapsed">0:00</span>
            <span aria-hidden="true">/</span>
            <span id="duration">0:29</span>
          </div>
          <span class="now-showing" id="chapter" aria-hidden="true">Atış</span>
          <div class="view-controls">
            <button class="tool" id="sound" type="button" aria-label="Sesi aç" title="Sesi aç">
              <span class="symbol symbol-sound" aria-hidden="true"></span>
              <span class="tool-label" id="sound-label">Sesi aç</span>
            </button>
            <button class="tool" id="framing" type="button" aria-label="Tam kadrajı göster"
              title="Tam kadrajı göster" aria-pressed="false">
              <span class="symbol symbol-frame" aria-hidden="true"></span>
            </button>
            <button class="tool" id="fullscreen" type="button" aria-label="Tam ekran" title="Tam ekran">
              <span class="symbol symbol-fullscreen" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
